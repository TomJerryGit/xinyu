name: Tauri Spike

on:
  workflow_dispatch:
  push:
    paths:
      - "spike/tauri/**"
      - "sidecar_server.py"
      - "static/**"
      - "templates/**"
      - "build_sidecar.py"
      - ".github/workflows/tauri-spike.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build sidecar
        run: python build_sidecar.py

      - name: Prepare Tauri sidecar resources
        run: python tools/prepare_tauri_bundle.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "spike/tauri/src-tauri -> target"

      - name: Build Tauri app
        working-directory: spike/tauri
        env:
          XINYU_ROOT: ${{ github.workspace }}
        run: tauri build --no-bundle --verbose

      - name: List artifacts
        shell: pwsh
        run: |
          Get-ChildItem spike\tauri\src-tauri\target\release\*.exe | Select-Object FullName, Length
          Get-ChildItem dist\XinyuSidecar\XinyuSidecar.exe | Select-Object FullName, Length

      - name: Measure window (best effort)
        continue-on-error: true
        shell: pwsh
        env:
          XINYU_ROOT: ${{ github.workspace }}
        run: |
          python tools\bench_tauri_window.py --exe spike\tauri\src-tauri\target\release\xinyu-tauri-spike.exe |
            Tee-Object -FilePath tauri-timing.txt

      - name: Upload Tauri spike
        uses: actions/upload-artifact@v4
        with:
          name: xinyu-tauri-spike
          if-no-files-found: error
          path: |
            spike/tauri/src-tauri/target/release/xinyu-tauri-spike.exe
            dist/XinyuSidecar/**
            tauri-timing.txt
