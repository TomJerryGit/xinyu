name: CI Local

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api.py"
      - "classics_database.py"
      - "question_bank.py"
      - "tests/**"
      - "static/**"
      - "templates/**"
      - ".github/workflows/ci-local.yml"

jobs:
  local-workspace:
    runs-on: [self-hosted, Windows, X64, xinyu]
    timeout-minutes: 30
    steps:
      - name: Test local D:\xinyu workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location 'D:\xinyu'
          & 'D:\Programs\Python\Python38\python.exe' -m py_compile api.py classics_database.py question_bank.py
          & 'D:\Programs\Python\Python38\python.exe' -m pytest -q
          & 'C:\Users\PL\.dsh\dsh-runtimes\dsh-primary-runtime\dependencies\node\bin\node.exe' --check static/js/main.js
