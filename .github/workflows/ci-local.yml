name: CI Local

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api.py"
      - "classics_database.py"
      - "question_bank.py"
      - "tests/**"
      - "static/**"
      - "templates/**"
      - "requirements*.txt"
      - ".github/workflows/ci-local.yml"

jobs:
  test:
    runs-on: [self-hosted, Windows, X64, xinyu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m pyflakes api.py engine.py utils.py logger.py version.py cache_manager.py database.py classics_database.py classics_importer.py question_bank.py backup_manager.py poetry_checker.py style_manager.py updater.py html_ui.py app.py test_runner.py exporter.py i18n_manager.py plugin_manager.py preference_learner.py tts_manager.py errors.py migrations.py crash_reporter.py single_instance.py legal.py tests

      - name: Unit tests
        run: python -m pytest -q

      - name: Frontend syntax
        run: node --check static/js/main.js
